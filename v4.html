<title>LB v4.2 · 방향 입력 던지기 + 착지 원 + 빨간 연쇄 + 강화 연출</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07080c;color:#fff;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#scene{position:fixed;left:0;top:0;width:100%;height:100%;will-change:transform}

.txt{position:absolute;left:0;right:0;text-align:center;pointer-events:none;transform-origin:50% 50%}
#word{font-weight:900;font-size:36px;letter-spacing:2px;line-height:1;text-shadow:0 0 18px currentColor}
#word.small{font-size:17px;font-weight:600;letter-spacing:1px;opacity:.75;text-shadow:none;animation:breathe 1.6s ease-in-out infinite}
#word.big{font-size:46px}

#info small{font-size:11px;font-weight:600;color:#cfd6e4;text-shadow:none;opacity:.8}
#dmg{font-weight:900;font-size:96px;line-height:1;opacity:0;font-variant-numeric:tabular-nums}
#dmg.crit{color:#ffd34a;text-shadow:0 0 24px #ffb02e,0 0 60px #ff8a1e}
#dmg.norm{color:#fff;text-shadow:0 0 20px #4da3ff}
.pop{animation:pop .32s cubic-bezier(.2,1.6,.4,1) both}
.popBig{animation:popBig .5s cubic-bezier(.15,1.7,.35,1) both}
@keyframes pop{0%{transform:scale(1.7);opacity:0}40%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes popBig{0%{transform:scale(2.6);opacity:0;filter:blur(6px)}35%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}
.cP{color:#ffd34a}.cS{color:#7fd4ff}.cF{color:#ff5d5d}.cC{color:#ffd34a}.cN{color:#cfd6e4}.cX{color:#8a8f99}
#ui{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 10px);display:flex;gap:4px;z-index:5}
#ui button,#mute,#gear,#panel button{font:600 11px/1 system-ui,sans-serif;color:#aab1c0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:7px 9px;touch-action:manipulation}

#panel{position:fixed;top:calc(env(safe-area-inset-top) + 44px);left:calc(env(safe-area-inset-left) + 10px);z-index:6;width:min(290px,calc(100vw - 20px));
  box-sizing:border-box;padding:10px 12px 12px;border-radius:12px;background:rgba(12,14,20,.95);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#cfd6e4;touch-action:auto}
#panel[hidden]{display:none}
#panel .row{margin-top:9px}#panel .row:first-child{margin-top:0}

#pad button.hit{animation:padHit .18s ease-out}

<body>
<div id="scene">
  <canvas id="cv"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="txt" id="word"></div>
  <div class="txt" id="sub"></div>
  <div class="txt" id="info"></div>
  <div class="txt" id="dmg"></div>
</div>
<button id="mute" aria-label="소리">🔊</button>
<button id="gear">⚙ 설정</button>
<div id="panel" hidden>
  <div class="row"><div class="lab"><span>완벽 시 향상 확률 P</span><b id="pv">50%</b></div>
    <input id="pP" type="range" min="0" max="100" step="5" value="50">
    <div class="note" id="pnote">성공 = P/2 · 전원 완벽 = P+20%p</div></div>
  <div class="row"><div class="lab"><span>좋아짐 방식</span></div>
    <div class="seg" data-o="mode"><button data-v="1" class="on">① 다시 굴려 높은 값</button><button data-v="2">② 눈 +1</button></div></div>
  <div class="row"><div class="lab"><span>시간 초과 때 실수 1회마다 명중 −1</span></div>
    <div class="seg" data-o="penalty"><button data-v="0" class="on">끔</button><button data-v="1">켬</button></div></div>
  <div class="row"><div class="lab"><span>원 판정</span></div>
    <div class="seg" data-o="direct"><button data-v="0" class="on">아무 곳 탭</button><button data-v="1">주사위 직접 탭</button></div></div>
  <div class="row"><div class="lab"><span>2단계 (착지 전 원)</span></div>
    <div class="seg" data-o="stage2"><button data-v="1" class="on">켬</button><button data-v="0">끔 (1단계만)</button></div></div>
</div>
<div id="ui"><button data-d="easy">쉬움</button><button data-d="normal" class="on">보통</button><button data-d="hard">어려움</button></div>
<div id="pad"><button data-k="L">←</button><button data-k="U">↑</button><button data-k="D">↓</button><button data-k="R">→</button></div>
<div id="sum"></div>
<div id="hint"></div>

<script>
'use strict';
// =====================================================================
//  v3: 3D 주사위 (직접 짠 WebGL 1, 외부 라이브러리 없음)
//  결과 눈을 먼저 정하고, 마지막 회전이 그 면을 위로 오게 궤적을 거꾸로 맞춘다.
// =====================================================================
const TUNE3={
  FOV:42, LENS_SHIFT:0.13,        // 화각(도), 화면 아래로 내리는 렌즈 이동
  DPR_MAX:2,                      // WebGL 해상도 상한
  SLOT_GAP:1.45,                  // 멈춘 주사위 간격(주사위 1 = 1)
  ROLL_MS:1150, ROLL_JITTER_MS:260, STAGGER_MS:90, CHAIN_DELAY_MS:420,
  DROP_H:[1.9,2.6],               // 던질 때 높이
  HOPS:[[0,0.2],[0.2,0.36,0.75],[0.36,0.48,0.30],[0.48,0.56,0.10]], // 튕김 구간(u)과 높이
  SPIN:[12,20],                   // 공중 회전 양
  IMPACT_TRAUMA:0.045,            // 착지 미세 셰이크
  CAM_ROLL:[0.70,0.72], CAM_END:[0.94,0.33], // 카메라 (높이·뒤 거리) × 거리
  HILITE_DELAY_MS:110,            // 멈춘 뒤 강조까지
  // 재질 색은 DIE_FS 셰이더 안 IVORY / GOLD / PIP 상수
};
let USE3D=false,gl=null,glc=null,G3=null,tray=0,trayT=0,gtime=0,dice3=[],seq3=null,VP=null,camE=[0,12,6],camC=[0,0,0];
window.__v3={log:[],frames:[]};

// ---------- 수학 ----------
const v3=(x,y,z)=>[x,y,z],vsub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],vlen=a=>Math.hypot(a[0],a[1],a[2]);
const vnorm=a=>{const l=vlen(a)||1;return[a[0]/l,a[1]/l,a[2]/l];},vcross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],vdot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function m4mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}return o;}
function m4persp(fy,asp,n,f,sy){const t=1/Math.tan(fy/2),nf=1/(n-f);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,sy,(f+n)*nf,-1,0,0,2*f*n*nf,0]);}
function m4look(e,c){const z=vnorm(vsub(e,c)),x=vnorm(vcross([0,1,0],z)),y=vcross(z,x);
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-vdot(x,e),-vdot(y,e),-vdot(z,e),1]);}
const qAxis=(a,ang)=>{const s=Math.sin(ang/2);return[a[0]*s,a[1]*s,a[2]*s,Math.cos(ang/2)];};
const qMul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qInv=q=>[-q[0],-q[1],-q[2],q[3]];
function qSlerp(a,b,t){let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3],bb=b;if(d<0){d=-d;bb=b.map(x=>-x);}
  if(d>0.9995){const o=a.map((x,i)=>x+(bb[i]-x)*t),l=Math.hypot(...o);return o.map(x=>x/l);}
  const th=Math.acos(d),s=Math.sin(th),wa=Math.sin((1-t)*th)/s,wb=Math.sin(t*th)/s;return a.map((x,i)=>x*wa+bb[i]*wb);}
function qRot(q,v){const u=[q[0],q[1],q[2]],t=vcross(u,v).map(x=>2*x),c=vcross(u,t);return[v[0]+q[3]*t[0]+c[0],v[1]+q[3]*t[1]+c[1],v[2]+q[3]*t[2]+c[2]];}
function m4qt(q,p){const[x,y,z,w]=q;return new Float32Array([1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w),0,2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w),0,2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y),0,p[0],p[1],p[2],1]);}
// 면 배치: +Y=1, -Y=6, +X=2, -X=5, +Z=3, -Z=4 (마주 보는 면 합 7)
const FACE_N={1:[0,1,0],6:[0,-1,0],2:[1,0,0],5:[-1,0,0],3:[0,0,1],4:[0,0,-1]};
const FACE_Q={1:[0,0,0,1],6:qAxis([1,0,0],Math.PI),2:qAxis([0,0,1],Math.PI/2),5:qAxis([0,0,1],-Math.PI/2),3:qAxis([1,0,0],-Math.PI/2),4:qAxis([1,0,0],Math.PI/2)};
function topFace(q){let best=0,bv=-9;for(const k in FACE_N){const y=qRot(q,FACE_N[k])[1];if(y>bv){bv=y;best=+k;}}return best;}

// ---------- 셰이더 ----------
const DIE_VS=`attribute vec3 aP;attribute vec3 aN;uniform mat4 uVP,uM;varying vec3 vOP,vON,vWP;
void main(){vOP=aP;vON=aN;vec4 w=uM*vec4(aP,1.0);vWP=w.xyz;gl_Position=uVP*w;}`;
const DIE_FS=`precision highp float;varying vec3 vOP,vON,vWP;uniform mat4 uM;uniform vec3 uCam;uniform float uGold,uDim,uHi,uTime,uRed;
const float PI=3.14159265;
const vec3 IVORY=vec3(0.80,0.71,0.53);   // 상아색 레진 (선형)
const vec3 GOLD=vec3(1.0,0.72,0.30);     // 금 F0
const vec3 PIP=vec3(0.010,0.010,0.012);  // 검은 눈 도료
const vec3 RED=vec3(0.13,0.003,0.010);   // v4.1 연쇄: 진홍 레진 (선형)
const vec3 PIPW=vec3(0.80,0.78,0.76);    // v4.1 연쇄: 흰 눈 도료
const vec3 RUST=vec3(1.45,0.62,0.42);    // v4.1 연쇄 실패: 적갈색으로 기우는 비율
const vec3 KEY=vec3(-0.42,0.88,0.52);
vec3 env(vec3 r){float sky=smoothstep(-0.25,0.7,r.y);vec3 c=mix(vec3(0.012,0.018,0.016),vec3(0.15,0.16,0.18),sky);
 vec3 k=normalize(KEY);float kd=max(dot(r,k),0.0);c+=vec3(1.0,0.93,0.82)*(7.0*pow(kd,110.0)+0.9*pow(kd,10.0));
 c+=vec3(0.55,0.70,1.0)*2.2*pow(max(dot(r,normalize(vec3(0.85,0.45,-0.35))),0.0),40.0);
 c+=vec3(0.8)*0.5*smoothstep(0.82,1.0,1.0-abs(r.y-0.22)*5.0)*smoothstep(0.0,-0.4,r.z);return c;}
float dggx(float nh,float a){float a2=a*a;float d=nh*nh*(a2-1.0)+1.0;return a2/(PI*d*d);}
bool act(float v,int i){if(i==0)return v==1.0||v==3.0||v==5.0;if(i<=2)return v>=2.0;if(i<=4)return v>=4.0;return v==6.0;}
vec2 cand(int i){if(i==0)return vec2(0.0);if(i==1)return vec2(-1.0,-1.0);if(i==2)return vec2(1.0,1.0);if(i==3)return vec2(1.0,-1.0);if(i==4)return vec2(-1.0,1.0);if(i==5)return vec2(-1.0,0.0);return vec2(1.0,0.0);}
vec3 shade(vec3 N,vec3 V,vec3 L,vec3 lc,vec3 alb,vec3 F0,float a,float wrap){vec3 H=normalize(L+V);float nl=max(dot(N,L),0.0),nh=max(dot(N,H),0.0),lh=max(dot(L,H),0.0);
 vec3 F=F0+(1.0-F0)*pow(1.0-lh,5.0);float dif=max((dot(N,L)+wrap)/(1.0+wrap),0.0);
 return lc*(alb*dif*(1.0-F)+dggx(nh,a)*F*nl/(4.0*max(lh*lh,0.12)));}
void main(){vec3 p=vOP,a=abs(p),n=normalize(vON);float val;vec2 uv;vec3 tu,tv;
 if(a.y>=a.x&&a.y>=a.z){val=p.y>0.0?1.0:6.0;uv=p.xz;tu=vec3(1,0,0);tv=vec3(0,0,1);}
 else if(a.x>=a.z){val=p.x>0.0?2.0:5.0;uv=p.zy;tu=vec3(0,0,1);tv=vec3(0,1,0);}
 else{val=p.z>0.0?3.0:4.0;uv=p.xy;tu=vec3(1,0,0);tv=vec3(0,1,0);}
 float best=9.0;vec2 bw=vec2(0.0);
 for(int i=0;i<7;i++){if(act(val,i)){vec2 w=uv-cand(i)*0.25;float d=length(w);if(d<best){best=d;bw=w;}}}
 const float RP=0.088;float pip=1.0-smoothstep(RP-0.007,RP+0.002,best);float rim=smoothstep(RP+0.035,RP,best)*(1.0-pip);
 vec2 w=bw/RP;float t=clamp(length(w),0.0,1.0);vec3 np=n;
 if(best<RP+0.002)np=normalize(n-(tu*w.x+tv*w.y)*1.1*t);          // 음각: 눈 안쪽 노멀이 가운데로 기움
 else if(rim>0.0)np=normalize(n+(tu*bw.x+tv*bw.y)/max(best,0.001)*0.25*rim); // 눈 테두리 경사
 vec3 N=normalize((uM*vec4(np,0.0)).xyz),V=normalize(uCam-vWP);
 float edge=1.0-max(max(abs(n.x),abs(n.y)),abs(n.z));
 float gB=uGold*(1.0-uRed);                                         // 금속 몸체는 상아 주사위만 (빨간 치명은 몸체 유지 + 금색 눈)
 vec3 body=mix(IVORY,RED,uRed),pipc=mix(mix(PIP,PIPW,uRed),vec3(0.85,0.40,0.03),uGold*uRed);
 vec3 alb=mix(mix(body,vec3(0.0),gB),pipc,pip);
 vec3 F0=mix(vec3(mix(0.045,0.055,uRed)),GOLD,gB*(1.0-pip));
 float rough=mix(mix(mix(0.30,0.15,uRed),0.20,gB),0.42,pip),ar=rough*rough;
 vec3 col=shade(N,V,normalize(KEY),vec3(3.1,2.9,2.6),alb,F0,ar,0.35);
 col+=shade(N,V,normalize(vec3(0.8,0.4,-0.4)),vec3(0.45,0.55,0.75),alb,F0,ar,0.5);
 col+=shade(N,V,normalize(vec3(0.1,0.35,-1.0)),vec3(0.9,0.85,0.8),alb,F0,ar,0.0);
 vec3 R=reflect(-V,N);float nv=max(dot(N,V),0.0);vec3 Fe=F0+(max(vec3(1.0-rough),F0)-F0)*pow(1.0-nv,5.0);
 col+=env(R)*Fe*(1.0-0.5*rough);
 col+=alb*mix(vec3(0.02,0.025,0.025),vec3(0.13,0.13,0.14),N.y*0.5+0.5);
 col+=F0*gB*(1.0-pip)*(0.10+0.30*max(N.y,0.0));                   // 금속: 주변광 반사 보강
 col+=IVORY*vec3(1.0,0.75,0.5)*0.07*(1.0-pip)*(1.0-uGold)*(1.0-uRed); // 레진 속 빛(서브서피스 흉내)
 col+=vec3(0.55,0.015,0.03)*uRed*(1.0-pip)*(0.06+0.45*pow(1.0-nv,2.0)+0.25*edge*4.0); // 빨간 레진: 모서리·비스듬한 곳으로 빛이 스며 나옴(반투명 흉내)
 col*=(1.0-rim*0.55)*(1.0-edge*0.45)*mix(1.0,0.55+0.45*t,pip);
 col+=mix(vec3(3.2,1.8,0.45),vec3(1.6,0.75,0.08),uRed)*pip*uGold*(0.85+0.15*sin(uTime*7.0));   // 치명: 금빛 눈 (빨간 주사위는 덜 하얗게 타도록 낮춤)
 col+=mix(vec3(0.35,0.62,1.0)*pow(1.0-nv,3.0)*1.3,vec3(1.0,0.95,0.93)*pow(1.0-nv,5.0)*0.75,uRed)*uHi; // 성공: 테두리 빛 (빨간 주사위는 가는 흰 빛)
 float l=dot(col,vec3(0.3,0.59,0.11));col=mix(col,mix(vec3(l),vec3(l)*RUST,uRed),uDim*0.85)*mix(1.0,mix(0.10,0.30,uRed),uDim); // 실패: 회색(상아) / 어두운 적갈색(빨강)
 col=(col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);gl_FragColor=vec4(pow(clamp(col,0.0,1.0),vec3(0.4545)),1.0);}`;
const FLOOR_VS=`attribute vec2 aQ;uniform mat4 uVP;uniform float uS;varying vec2 vXZ;void main(){vXZ=aQ*uS;gl_Position=uVP*vec4(vXZ.x,0.0,vXZ.y,1.0);}`;
const FLOOR_FS=`precision mediump float;varying vec2 vXZ;uniform sampler2D uTex;uniform float uA;uniform vec2 uC;

  if(phase==='air'){tapS2(now,null,null);return;}
  if(restartOk(now)){resetIdle();startRun(now);}});
['touchstart','touchmove','gesturestart','dblclick'].forEach(t=>addEventListener(t,e=>{if(!e.target.closest('#ui,#mute,#panel,#gear,#pad'))e.preventDefault();},{passive:false}));
pad.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();unlockAudio();const now=performance.now();
  b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');
  if(phase==='idle'){startRun(now);return;}
  if(restartOk(now)){resetIdle();startRun(now);return;}
  if(phase==='run')dirInput(b.dataset.k,now);});
$('#ui').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-d]');if(!b||!(phase==='idle'||phase==='done'))return;
  diff=b.dataset.d;document.querySelectorAll('#ui button').forEach(x=>x.classList.toggle('on',x===b));
  if(phase==='done'){resetIdle();phase='idle';G=null;tension=0;cam.zoomT=1;pad.classList.remove('off');setWord('탭 또는 아무 방향키로 시작','small');setHint('');}});
$('#mute').addEventListener('pointerdown',()=>{unlockAudio();muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';});
$('#gear').addEventListener('pointerdown',()=>{panel.hidden=!panel.hidden;});
function updNote(){$('#pv').textContent=OPT.P+'%';$('#pnote').textContent=`성공 = ${OPT.P/2}% · 전원 완벽 = ${Math.min(100,OPT.P+TUNE4.ALL_PERFECT_BONUS)}%`;}
$('#pP').addEventListener('input',e=>{OPT.P=+e.target.value;updNote();});
document.querySelectorAll('#panel .seg').forEach(seg=>seg.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;
  OPT[seg.dataset.o]=+b.dataset.v;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}));

if(!/[?&]2d\b/.test(location.search))init3D();else $('#gl').style.display='none';
layout();setWord('탭 또는 아무 방향키로 시작','small');setHint('화살표 순서대로 입력 → 착지 직전 원 타이밍');updNote();
requestAnimationFrame(t=>{lastT=t;frame(t);});
</script>
</body>
</html>
