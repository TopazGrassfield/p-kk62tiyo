<!doctype html>
<html lang="ko">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07080c">
<title>LB v4.13 · 디오라마 텍스처 바닥</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07080c;color:#fff;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#scene{position:fixed;left:0;top:0;width:100%;height:100%;will-change:transform}
#cv,#gl,#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.txt{position:absolute;left:0;right:0;text-align:center;pointer-events:none;transform-origin:50% 50%}
#word{font-weight:900;font-size:36px;letter-spacing:2px;line-height:1;text-shadow:0 0 18px currentColor}
#word.small{font-size:17px;font-weight:600;letter-spacing:1px;opacity:.75;text-shadow:none;animation:breathe 1.6s ease-in-out infinite}
#word.big{font-size:46px}
#sub{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
#info{font-size:16px;font-weight:800;color:#ffd34a;text-shadow:0 0 14px rgba(255,176,46,.6);opacity:0;transition:opacity .25s;line-height:1.35}
#info small{font-size:11px;font-weight:600;color:#cfd6e4;text-shadow:none;opacity:.8}
#dmg{font-weight:900;font-size:96px;line-height:1;opacity:0;font-variant-numeric:tabular-nums}
#dmg.crit{color:#ffd34a;text-shadow:0 0 24px #ffb02e,0 0 60px #ff8a1e}
#dmg.norm{color:#fff;text-shadow:0 0 20px #4da3ff}
.pop{animation:pop .32s cubic-bezier(.2,1.6,.4,1) both}
.popBig{animation:popBig .5s cubic-bezier(.15,1.7,.35,1) both}
@keyframes pop{0%{transform:scale(1.7);opacity:0}40%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes popBig{0%{transform:scale(2.6);opacity:0;filter:blur(6px)}35%{opacity:1;filter:blur(0)}100%{transform:scale(1);opacity:1}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.9}}
.cP{color:#ffd34a}.cS{color:#7fd4ff}.cF{color:#ff5d5d}.cC{color:#ffd34a}.cN{color:#cfd6e4}.cX{color:#8a8f99}
#ui{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 10px);display:flex;gap:4px;z-index:5}
#ui button,#mute,#gear,#panel button{font:600 11px/1 system-ui,sans-serif;color:#aab1c0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:7px 9px;touch-action:manipulation}
#ui button.on,#panel button.on{color:#07080c;background:#cfd6e4;border-color:#cfd6e4}
#side{position:fixed;top:calc(env(safe-area-inset-top) + 40px);right:calc(env(safe-area-inset-right) + 10px);display:flex;gap:4px;z-index:5}   /* v4.6 공격/방어 토글 */
#side button{font:600 10px/1 system-ui,sans-serif;color:#aab1c0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:5px 8px;touch-action:manipulation}
#side button.on[data-s=atk]{color:#07080c;background:#ffb27a;border-color:#ffb27a}#side button.on[data-s=def]{color:#07080c;background:#a9c8ec;border-color:#a9c8ec}
#foe{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 74px);text-align:center;font-size:12px;line-height:1.45;color:#c9d6e8;pointer-events:none;z-index:3;text-shadow:0 1px 6px #000}
#foe b{color:#ff8a6e}#foe i{font-style:normal;color:#ffd34a;font-weight:800}
#dmg small{display:block;font-size:15px;font-weight:700;margin-top:8px;color:#cfd6e4;text-shadow:0 1px 8px #000;letter-spacing:0}
#dmg.shield{color:#cfe2ff;text-shadow:0 0 20px #5a8fd6}
#mute{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);z-index:5;font-size:14px;padding:5px 8px}
#gear{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 52px);z-index:5}
#panel{position:fixed;top:calc(env(safe-area-inset-top) + 44px);left:calc(env(safe-area-inset-left) + 10px);z-index:6;width:min(290px,calc(100vw - 20px));
  box-sizing:border-box;padding:10px 12px 12px;border-radius:12px;background:rgba(12,14,20,.95);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#cfd6e4;touch-action:auto}
#panel[hidden]{display:none}
#panel .row{margin-top:9px}#panel .row:first-child{margin-top:0}
#panel .lab{display:flex;justify-content:space-between;margin-bottom:5px;color:#8a92a3}
#panel .lab b{color:#ffd34a}
#panel .seg{display:flex;gap:4px}#panel .seg button{flex:1;padding:7px 4px}
#panel input[type=range]{width:100%;accent-color:#ffd34a;touch-action:auto}
#panel .note{font-size:10px;color:#6b7385;margin-top:2px}
#pad{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 40px);display:flex;justify-content:center;gap:10px;z-index:4;transition:opacity .25s}
#pad.off{opacity:0;pointer-events:none}
#pad button{width:66px;height:58px;font:700 26px/1 system-ui,sans-serif;color:#cfd6e4;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;touch-action:manipulation}
#pad button.hit{animation:padHit .18s ease-out}
@keyframes padHit{0%{background:rgba(255,211,74,.45);transform:scale(.92)}100%{background:rgba(255,255,255,.06);transform:scale(1)}}
#sum{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 40px);text-align:center;font-size:13px;color:#aab1c0;pointer-events:none;font-variant-numeric:tabular-nums}
#sum b{color:#5cf2a6}#sum i{font-style:normal;color:#ffd34a}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);text-align:center;font-size:12px;color:#8a92a3;pointer-events:none;transition:opacity .3s}
</style>
</head>
<body>
<div id="scene">
  <canvas id="cv"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="txt" id="word"></div>
  <div class="txt" id="sub"></div>
  <div class="txt" id="info"></div>
  <div class="txt" id="dmg"></div>
</div>
<button id="mute" aria-label="소리">🔊</button>
<button id="gear">⚙ 설정</button>
<div id="panel" hidden>
  <div class="row"><div class="lab"><span>완벽 시 향상 확률 P</span><b id="pv">50%</b></div>
    <input id="pP" type="range" min="0" max="100" step="5" value="50">
    <div class="note" id="pnote">성공 = P/2 · 전원 완벽 = P+20%p</div></div>
  <div class="row"><div class="lab"><span>좋아짐 방식</span></div>
    <div class="seg" data-o="mode"><button data-v="1" class="on">① 다시 굴려 높은 값</button><button data-v="2">② 눈 +1</button></div></div>
  <div class="row"><div class="lab"><span>시간 초과 때 실수 1회마다 명중 −1</span></div>
    <div class="seg" data-o="penalty"><button data-v="0" class="on">끔</button><button data-v="1">켬</button></div></div>
  <div class="row"><div class="lab"><span>원 판정</span></div>
    <div class="seg" data-o="direct"><button data-v="0" class="on">아무 곳 탭</button><button data-v="1">주사위 직접 탭</button></div></div>
  <div class="row"><div class="lab"><span>2단계 (착지 전 원)</span></div>
    <div class="seg" data-o="stage2"><button data-v="1" class="on">켬</button><button data-v="0">끔 (1단계만)</button></div></div>
  <div class="row"><div class="lab"><span>타이밍 표시</span></div>
    <div class="seg" data-o="timing"><button data-v="1" class="on">주사위 실루엣</button><button data-v="0">원</button></div></div>
  <div class="row"><div class="lab"><span>실패 주사위 깨짐</span></div>
    <div class="seg" data-o="shatter"><button data-v="1" class="on">켬</button><button data-v="0">크랙만</button></div></div>
</div>
<div id="side"><button data-s="atk" class="on">공격</button><button data-s="def">방어</button></div>
<div id="foe"></div>
<div id="ui"><button data-d="easy">쉬움</button><button data-d="normal" class="on">보통</button><button data-d="hard">어려움</button></div>
<div id="pad"><button data-k="L">←</button><button data-k="U">↑</button><button data-k="D">↓</button><button data-k="R">→</button></div>
<div id="sum"></div>
<div id="hint"></div>

<script>
'use strict';
// =====================================================================
//  v3: 3D 주사위 (직접 짠 WebGL 1, 외부 라이브러리 없음)
//  결과 눈을 먼저 정하고, 마지막 회전이 그 면을 위로 오게 궤적을 거꾸로 맞춘다.
// =====================================================================
const TUNE3={
  FOV:42, LENS_SHIFT:0.13,        // 화각(도), 화면 아래로 내리는 렌즈 이동
  DPR_MAX:2,                      // WebGL 해상도 상한
  SLOT_GAP:1.45,                  // 멈춘 주사위 간격(주사위 1 = 1)
  ROLL_MS:1150, ROLL_JITTER_MS:260, STAGGER_MS:90, CHAIN_DELAY_MS:420,
  DROP_H:[1.9,2.6],               // 던질 때 높이
  HOPS:[[0,0.2],[0.2,0.36,0.75],[0.36,0.48,0.30],[0.48,0.56,0.10]], // 튕김 구간(u)과 높이
  SPIN:[12,20],                   // 공중 회전 양
  IMPACT_TRAUMA:0.045,            // 착지 미세 셰이크
  CAM_ROLL:[0.70,0.72], CAM_END:[0.94,0.33], // 카메라 (높이·뒤 거리) × 거리
  HILITE_DELAY_MS:110,            // 멈춘 뒤 강조까지
  // 재질 색은 DIE_FS 셰이더 안 IVORY / GOLD / PIP 상수
};
// ================= v4.3 상수 (던전 바닥 + 몸체 중심 강화 효과) =================
const TUNE43={
  // 던전 (월드 단위: 주사위 1 = 1)
  WALL_K:[-0.4,0.34], WALL_H:1.2, BRICK:[0.62,0.30], // 옆벽 = 화면 왼쪽 끝 기준 안쪽(−)/바깥(+) 거리, 뒷벽 = 카메라 거리 × 비율, 벽 높이, 벽돌 길이·높이
  TEX:1024, FLOOR_TILE:7, FLOOR_BUMP:9.0,   // 바닥 텍스처 크기(시작 시 1번 생성), 반복 간격, 요철 세기
  TORCH_Y:1.5, TORCH_ZK:0.42, TORCH_I:9.0, TORCH_DIE:1.0, // 횃불 높이, 앞뒤 위치(뒷벽 거리 비율), 세기(바닥·벽), 주사위에 닿는 횃불빛
  AMB:0.24, SPOT:0.8,                       // 차가운 환경광, 가운데 위쪽 빛(결과 주사위가 잘 보이게)
  ROCKS:[16,14,10], PEBBLES:70,             // 돌멩이 (옆벽 밑·뒷벽 밑·오른쪽 가장자리), 잔돌
  MOTES:90, MAX_PT:900,                     // 공중 먼지 개수, 효과 입자 상한
  DUST_HOP:9, DUST_LAND:18, DUST_KEEP:5,    // 튕길 때 / 강화 착지 / 유지 착지 먼지 덩어리 수
  // 강화 (몸체 중심)
  GLOW:1.0, KEEP:0.5, FLASH_MS:280,         // 몸체 빛 세기, "유지"일 때 배율, 착지 뒤 빛이 빠지는 시간
  CH_N:3, TRAIL_N:3,                        // 충전 중 빨려 드는 빛 조각, 회전 중 꼬리 입자 (프레임당)
  SPARK_N:64, SPARK_KEEP:12,                // 착지 폭발 입자 수 (강화 / 유지)
  SHELL_MS:380, SHELL_R:[0.55,2.6],         // 구형 충격파 길이, 반지름 (시작 → 끝)
};
// v4.4: 실패 주사위 크랙 → 깨짐 물리
const TUNE44={
  CRACK_MS:700, HOLD_MS:320,               // 금이 다 퍼지는 시간, 다 퍼진 뒤 멈춤
  DMG_GAP_MS:380, STAGGER_MS:150,          // 피해 숫자 팝 뒤 첫 깨짐까지, 실패 주사위끼리 시차
  CRACK_REACH:1.9, CRACK_W:[0.007,0.02],   // 금이 뻗는 거리(주사위 1 = 1), 금 굵기 (시작 → 끝)
  DIM_FAIL:[0.20,0.42],                    // 실패 주사위 밝기 (상아 / 빨간 연쇄). v4.3은 0.10 / 0.30 → 조각 모양이 보이게 올림
  TREMOR:0.012,                            // 금 가는 동안 떨림 크기
  FRAGS:12, SEED_GAP:0.33, PATTERNS:3, MAX_FRAG:140,   // 주사위 1개당 조각 수, 조각 씨앗 최소 간격, 미리 만드는 조각 모양 수, 화면 전체 조각 상한
  G:22, OUT:[0.7,2.0], UP:[0.6,2.0], SPIN:[3,9],   // 중력, 바깥으로 튀는 속도, 위로 뜨는 속도, 회전 속도(rad/s)
  BOUNCE:0.28, MU:0.6, ROLL:2.5, SLIDE:1.2, // 튕김 정도, 마찰, 바닥에서 회전·미끄럼 감쇠
  SLEEP_S:0.35, SUB:2,                     // 이 시간 동안 거의 안 움직이면 멈춤, 프레임당 물리 나눔
  TRAUMA:0.10, POWDER:26, DUST:12,         // 깨질 때 셰이크, 돌가루 입자 수, 먼지 덩어리 수
  SND_V:1.2, SND_MAX:3,                    // 이보다 빠르게 부딪히면 딸깍, 프레임당 딸깍 최대 수
};
// v4.5: 실패 주사위는 자기 최종 눈이 정해지는 순간 바로 금 → 깨짐 (결과 공개·피해 숫자를 기다리지 않음)
const TUNE46={
  FAIL_DELAY_MS:60,     // 멈춘(강화가 끝난) 뒤 금 시작까지. 이 사이 실패 눈이 읽힘
  CRACK_MS:300,         // 금이 다 퍼지는 시간 (v4.4 = 700)
  HOLD_MS:90,           // 다 퍼진 뒤 깨지기 전 멈춤 (v4.4 = 320)
  DIM_RATE:22,          // 금 시작 때 색이 빠지는 빠르기 (v4.4 결과 공개 때 = 8)
};
// ================= v4.6 조절값: 성공 눈 → 아이콘 "뿅" 변신 =================
const TUNE47={
  POP_DELAY_MS:60,      // 최종 눈 확정 → 뿅 시작 (실패 금과 같은 박자)
  STAGGER_MS:60,        // 여러 주사위가 동시에 확정될 때 뿅 사이 시차 (요청 40~80)
  SHRINK_MS:70,         // 눈금이 오그라드는 시간
  GROW_MS:240,          // 아이콘이 튀어나와 정착하는 시간
  OVER:0.5,OVER_BIG:0.9,// 튀어나올 때 넘치는 정도 (일반 / 치명·연쇄·금테 방패)
  SQUASH:0.22,          // 스쿼시·스트레치 세기 (가로·세로 엇갈림)
  SPARK_N:14,SPARK_BIG:30,  // 반짝 파티클 수
  CHAIN_AFTER_MS:260,   // 6: "연쇄!" + 연쇄 아이콘 뒤 빨간 주사위가 튀어나오기까지
};
window.__v46={pops:[]};
// ================= v4.6 조절값: 던지는 대형 = 손에서 쏟아지는 느슨한 줄 (2×2 뭉치 대신) =================
const TUNE48={
  LINE:1,               // 1 = 줄 대형, 0 = v4.5 격자
  THROW_STAGGER_MS:55,  // 하나씩 손을 떠나는 시차 (요청 40~70)
  HOLD_STEP_U:0.04,     // 공중에 머무는 궤적 지점의 주사위 간 차이 → 줄 길이·착지 따다닥 간격(약 45ms)
  AIR_GAP:1.4,          // 출발 위치를 던진 방향 뒤로 하나씩 물림 (공중 줄 간격)
  AIR_X:[0.35,0.18],    // 공중 좌우 엇갈림·흔들림
  LINE_GAP_Z:1.2,       // 멈춘 줄: 앞뒤 간격
  LINE_X:0.62,          // 멈춘 줄: 좌우 엇갈림(지그재그)
  LINE_SKEW:0.12,       // 줄이 살짝 사선으로 기우는 정도
  CHAIN_DX:1.6,         // 빨간 주사위 자리: 부모 바깥쪽 옆
  ROLL_JIT_MS:70,       // 구르는 시간 흔들림 (v4.5 = 260, 크면 착지 순서가 뒤바뀜)
};
// ================= v4.7 조절값: 방향 입력 = 관문, 성공률만큼 타이밍 원, 보상은 원에서만 (모두 임시값) =================
const DIFF_ARROWS={      // 난이도 = 화살표 수 n · 제한 시간 T(ms, 주사위가 땅에 닿기까지)
  easy:  {n:4,T:4000},
  normal:{n:6,T:3800},
  hard:  {n:8,T:3600},
};
const TUNE49={
  GATE:0.5,             // 입력 성공률이 이 값 미만이면 방향 입력 실패 = 원 없음
  MISS_STUN_MS:140,     // 틀린 키: 그 화살표 ✕ 후 다음으로 (짧은 경직)
  UP_PERF:50,           // 원 완벽 → 그 주사위 강화 확률(%)
  UP_GOOD:25,           // 원 성공 → 강화 확률(%)
  CRIT_PERF:5,          // 원 완벽 → 그 주사위 치명 기준 5+
  CRITP_CRIT:4,         // 크리티컬+(입력 100% + 원 받은 주사위 전부 완벽) → 그 판 모든 주사위 치명 4+
  CRITP_UP:70,          // 크리티컬+ → 원 받은 주사위 강화 확률(%)
  NO_RING_DIM:0.45,     // 원을 못 받은 주사위: 공중에서 어둡게
  GATE_SHOW_MS:520,     // "주사위 액션 3/4" 표시 → 원 단계 시작
  FAIL_SHOW_MS:560,     // "실패" 표시 → 바로 착지
  CRITP_HOLD_MS:420,    // 크리티컬+ 연출 → 착지
};

    const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(MASTER);s.start(0);
    NOISE=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(type,f0,f1,dur,vol,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,ftype,freq,delay,q){if(!AC||muted)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NOISE;f.type=ftype;f.frequency.value=freq;f.Q.value=q||0.8;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(MASTER);s.start(t,Math.random()*0.2,dur+0.05);}

// ================= 카메라 (트라우마 셰이크 + 줌 펀치) =================
const cam={trauma:0,punch:0,punchV:0,zoomT:1,zoom:1,seed:Math.random()*100};
const nz=(t,s)=>Math.sin(t*12.9+s)*0.5+Math.sin(t*7.3+s*2.1)*0.3+Math.sin(t*23.1+s*0.7)*0.2;
function addTrauma(a){cam.trauma=clamp(cam.trauma+a,0,1);}
function kick(a){cam.punchV+=a*22;}
function updCam(dt,now){
  cam.trauma=Math.max(0,cam.trauma-TUNE.TRAUMA_DECAY*dt);
  cam.punchV+=(-260*cam.punch-20*cam.punchV)*dt;cam.punch+=cam.punchV*dt;
  cam.zoom+=(cam.zoomT-cam.zoom)*Math.min(1,dt*4);
  const s=cam.trauma*cam.trauma,L=TUNE.SHAKE_LEVEL,t=now/1000;
  const x=TUNE.SHAKE_PX[L]*s*nz(t,cam.seed),y=TUNE.SHAKE_PX[L]*s*nz(t,cam.seed+40),r=TUNE.SHAKE_ROT[L]*s*nz(t,cam.seed+80);
  scene.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(3)}deg) scale(${(cam.zoom+cam.punch).toFixed(4)})`;}

const parts=[],waves=[],cracks=[],labels=[];let bloom=0,bloomCol='255,210,90',desat=0;
const PAL={ok:['#bfeaff','#7fd4ff','#4da3ff','#ffffff'],perfect:['#fff3b0','#ffd34a','#ffb02e','#ffffff'],crit:['#fff6c8','#ffd34a','#ffb02e','#ff8a1e','#ffffff'],fail:['#ff8080','#b33','#555'],up:['#d8ffec','#5cf2a6','#2fd08a','#ffffff'],chain:['#ffd0d4','#ff4d5e','#e0122a','#9b0016','#ffffff']};
function burst(x,y,n,pal,sp,opt){opt=opt||{};const out=opt.dir;
  for(let i=0;i<n;i++){if(parts.length>=TUNE.PARTICLE_MAX)parts.shift();
    let a=Math.random()*PI2;if(out!==undefined)a=out+rnd(-1.1,1.1);
    const v=sp*rnd(0.25,1)*(Math.random()<0.15?1.6:1);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rnd(0.35,0.8)*(opt.life||1),size:rnd(1.2,3.2)*(opt.size||1),c:pal[(Math.random()*pal.length)|0],g:opt.g||260,dot:Math.random()<0.3});}}
function wave(x,y,r1,dur,col,w){waves.push({x,y,r1,dur,col,w,t:0});}
function crack(x,y,dirA,len){const lines=[];for(let b=0;b<4;b++){let a=dirA+rnd(-0.9,0.9),px=x,py=y;const pts=[[px,py]];
  for(let i=0;i<5;i++){a+=rnd(-0.5,0.5);const l=len*rnd(0.12,0.24);px+=Math.cos(a)*l;py+=Math.sin(a)*l;pts.push([px,py]);}lines.push(pts);}
  cracks.push({lines,t:0,dur:0.75});}
function label(x,y,txt,sub2,col){labels.push({x,y,txt,sub:sub2,col,t0:performance.now()});}
function updFx(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue;}
    p.vx*=Math.pow(0.04,dt);p.vy*=Math.pow(0.04,dt);p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=waves.length-1;i>=0;i--){waves[i].t+=dt;if(waves[i].t>=waves[i].dur)waves.splice(i,1);}
  for(let i=cracks.length-1;i>=0;i--){cracks[i].t+=dt;if(cracks[i].t>=cracks[i].dur)cracks.splice(i,1);}
  bloom=Math.max(0,bloom-dt*2.2);desat=Math.max(0,desat-dt*2.0);}
function onUpLit(x,y){burst(x,y,26,PAL.up,380,{g:-160});wave(x,y,42,0.32,'92,242,166',3);SFX.up();}

let diff='normal',phase='idle',G=null,S2=null,lastT=performance.now(),hitstopUntil=0,slowUntil=0,endT=0,dice=[],tension=0,dieSeq=null;
window.__games=[];
function setWord(t,cls,popCls){word.className='txt '+(cls||'');word.textContent=t;if(popCls){void word.offsetWidth;word.classList.add(popCls);}}
function setHint(t){hint.textContent=t;}
const DIRS={U:-90,R:0,D:90,L:180};
// v4.12: 손가락 기준 칸 크기(최소 44) · 지금 칸 1.3배. 칸이 안 들어가면 간격부터 줄임
function arrowSize(n){const T=TUNE53,av=W-16-2*T.PANEL_PAD;return clamp((av-(n-1)*T.ARROW_GAP)/n,Math.min(T.ARROW_MIN,(av-(n-1)*2)/n),T.ARROW_MAX);}
function arrowGap(n){const T=TUNE53,s=arrowSize(n),av=W-16-2*T.PANEL_PAD;return clamp((av-n*s)/Math.max(1,n-1),2,T.ARROW_GAP+s*(T.CUR_SCALE-1)/2);}
function airCenter(){if(USE3D&&VP&&dice3.length){let sx=0,sy=0;for(const d of dice3){const p=proj(d.pos);sx+=p[0];sy+=p[1];}return[sx/dice3.length,sy/dice3.length];}return[cx,cy];}
function arrowXY(i,n){const s=arrowSize(n),g=arrowGap(n),tw=n*s+(n-1)*g;return[cx-tw/2+s/2+i*(s+g),USE3D?H-TUNE45.ARROW_BOTTOM:cy];}
// v4.12 방향 패널 영역(화면 px): 공중 주사위는 이 위쪽에만 머문다
function arrowPanel(n){const T=TUNE53,s=arrowSize(n),g=arrowGap(n),tw=n*s+(n-1)*g,y=arrowXY(0,n)[1],top=y-s*T.CUR_SCALE/2-T.PANEL_PAD+2,barY=y+s*0.5+12;
  return{x:cx-tw/2-T.PANEL_PAD,y:top,w:tw+2*T.PANEL_PAD,h:barY+T.BAR_H+T.PANEL_PAD-top,barY,s,g};}

// ---------- 1단계: 탭하면 바로 던지고, 주사위가 공중에 있는 동안 방향 입력 ----------
function startRun(now){const D=DIFF[diff],A=DIFF_ARROWS[diff];   // v4.7: 화살표 수·제한 시간은 DIFF_ARROWS, 원 판정 폭은 DIFF
  G={D,seq:Array.from({length:A.n},()=>'UDLR'[(Math.random()*4)|0]),k:0,t0:now,T:A.T,mistakes:0,hits:0,miss:[],stunUntil:0,litAt:[],tier:'normal',remFrac:1,timeout:false,released:false,rate:0,ringN:0};
  S2=null;dice=[];dieSeq=null;reset3D();labels.length=0;tension=0;cam.zoomT=1;
  dmgEl.style.opacity=0;dmgEl.className='txt';sumEl.innerHTML='';info.style.opacity=0;AMMO={items:[],sum:0};
  word.style.transition='';word.style.top=(cy-100)+'px';
  phase='run';pad.classList.remove('off');setWord('','');sub.textContent='';
  setHint('착지 전에 방향키·WASD · 스와이프 · 아래 버튼');SFX.start();
  if(SIDE==='def'){if(!FOE||FOE.used)FOE=rollFoe();FOE.used=true;showFoe();}   // v4.6: 이번 판에 막을 적 공격
  throwDice(now);}
function dirInput(k,now){
  if(phase!=='run'||now<G.stunUntil)return;
  const n=G.seq.length,[bx,by]=arrowXY(G.k,n),s=arrowSize(n);
  if(k===G.seq[G.k]){G.litAt[G.k]=now;G.k++;G.hits++;
    burst(bx,by,TUNE4.P_ARROW,PAL.ok,420);wave(bx,by,s*0.8,0.25,'127,212,255',3);bloom=Math.max(bloom,0.1);bloomCol='120,200,255';
    SFX.arrow(G.hits);addTrauma(0.1);kick(TUNE.ZOOM_PUNCH_OK);tension=G.k/n;cam.zoomT=1+TUNE.ZOOM_TENSION*tension;}
  else{G.mistakes++;G.miss[G.k]=true;G.litAt[G.k]=now;G.k++;G.stunUntil=now+TUNE49.MISS_STUN_MS;   // v4.7: 틀려도 처음부터가 아니라 그 화살표만 ✕, 다음으로
    burst(bx,by,10,PAL.fail,200,{g:500});addTrauma(TUNE.TRAUMA_FAIL*0.45);kick(TUNE.ZOOM_PUNCH_FAIL*0.5);SFX.miss();tension=G.k/n;}
  if(G.k>=n)completeRun(now);
  draw(now);}
// v4.7: 방향 입력 끝(전부 입력 또는 시간 초과) → 성공률 → 원 받을 주사위 수. 방향 입력 자체의 크리티컬 보너스는 없음(관문 역할만)
function completeRun(now){const n=G.seq.length,rem=Math.max(0,G.T-(now-G.t0));G.remFrac=rem/G.T;G.endAt=now;phase='end';pad.classList.add('off');
  for(let i=G.k;i<n;i++)G.miss[i]=true;   // 시간 초과: 남은 화살표 모두 실패
  G.rate=G.hits/n;const nd=G.base?G.base.length:nDice();G.ringN=G.s2on?ringCount(G.rate,nd):0;G.gateFail=G.rate<TUNE49.GATE;
  if(USE3D)for(const d of dice3)if(!d.chain&&d.idx>=G.ringN)d.noRing=true;
  if(G.gateFail){desat=1;SFX.fail();addTrauma(0.3);kick(-0.04);setWord('실패','cF big','pop');sub.textContent=G.timeout?'시간 초과':'';
    setTimeout(()=>{if(G&&phase==='end')endStage1();},TUNE49.FAIL_SHOW_MS);return;}
  if(!G.s2on){SFX.ok();setWord('통과','cN big','pop');sub.textContent='2단계 끔';setTimeout(()=>{if(G&&phase==='end')endStage1();},TUNE49.GATE_SHOW_MS);return;}
  const all=G.ringN>=nd;hitstopUntil=now+TUNE.HITSTOP_PERFECT;(all?SFX.perfect:SFX.ok)();
  setWord('','');sub.textContent=G.timeout?'시간 초과':'';cam.zoomT=1+TUNE.ZOOM_TENSION*1.2;   // v4.9: "주사위 액션 n/n" 글자 없음 (소리·빛만)
  if(all){const [ax,ay]=airCenter();burst(ax,ay,TUNE.P_OK,PAL.ok,520);wave(ax,ay,R*1.2,0.35,'127,212,255',4);}
  setTimeout(()=>{if(G&&phase==='end')endStage1();},TUNE49.GATE_SHOW_MS);}
function timeoutRun(now){G.timeout=true;completeRun(now);}
function critImpact(tier){const now=performance.now(),big=tier==='crit2';const [cx,cy]=airCenter();   // v4.4: 공중 주사위 무리 한가운데서 터짐
  hitstopUntil=now+TUNE.HITSTOP_CRIT;addTrauma(TUNE.TRAUMA_CRIT*(big?1:0.75));kick(TUNE.ZOOM_PUNCH_CRIT*(big?1:0.7));
  bloom=big?1.3:1;bloomCol='255,205,90';
  burst(cx,cy,Math.round(TUNE.P_CRIT*(big?1:0.65)),PAL.crit,big?980:760,{size:1.3,life:1.2});
  wave(cx,cy,Math.hypot(W,H)*0.6,0.7,'255,211,74',big?10:7);wave(cx,cy,R*1.6,0.45,'255,255,255',3);
  SFX.crit();setWord('완벽 투척','cC big','popBig');sub.textContent='';cam.zoomT=1.02;   // v4.8: 판 전체 등급 이름 (주사위 하나의 결과 = 치명)
  setTimeout(()=>{if(G&&phase==='end')endStage1();},TUNE45.CRIT_TO_S2_MS);}

// ---------- 던지기: 탭한 순간. 기본 눈은 여기서 정한다 ----------
function throwDice(now){
  G.base=Array.from({length:nDice()},R6);for(let i=0;i<Math.min(window.__force6|0,G.base.length);i++)G.base[i]=6;if(window.__forceBase)window.__forceBase.forEach((v,i)=>{if(v&&i<G.base.length)G.base[i]=v;});
  G.s2on=!!OPT.stage2;G.P=OPT.P;G.mode=OPT.mode;G.direct=OPT.direct;G.throwAt=now;G.thrown=true;SFX.swish();

    ctx.restore();ctx.globalAlpha=1;
    const fl2=d.upFlT?Math.max(0,1-(now-d.upFlT)/TUNE43.FLASH_MS):0,gw=Math.max(d.upCh>0?(0.35+0.65*d.upCh)*(0.8+0.2*Math.sin(now/45)):0,fl2*1.4)*(d.v===d.base&&d.upDone?TUNE43.KEEP:1);
    if(gw>0.01){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(92,242,190,${Math.min(1,gw)})`;ctx.lineWidth=2+2*gw;
      ctx.shadowColor='#5cf2be';ctx.shadowBlur=18*gw;rr(-s/2,-s/2,s,s,s*0.2);ctx.stroke();ctx.fillStyle=`rgba(92,242,190,${0.25*Math.min(1,gw)})`;ctx.fill();ctx.restore();}   // v4.3: 몸체 테두리 빛
    if(d.settled&&d.up&&d.upDone)upMark(x,y-s*0.95,now,d.base,d.v);}
  if(USE3D&&VP)for(const d of dice3){if(d.sc===0)continue;   // v4.3: 바닥 고리 없음 (효과는 3D 몸체에서) · v4.9: 탄으로 바뀐 주사위는 ▲ 표시도 사라짐
    if(d.upCh>0||((d.lit||d.upDone)&&d.up)){const p=proj([d.pos[0],1.0,d.pos[2]-0.95]);if((d.lit||d.upDone)&&d.up)upMark(p[0],p[1],now,d.base,d.v);}}
  if(S2&&phase==='air')drawRings(now);
  if(a1>0.01&&USE3D){ctx.globalCompositeOperation='source-over';drawStage1(now,a1);   // v4.4: 공중 주사위 위에 화살표·시간 막대·틀림 금
    for(const c of cracks){const a=1-c.t/c.dur;ctx.lineCap='round';ctx.lineJoin='round';
      for(const pass of [[`rgba(0,0,0,${0.6*a})`,4],[`rgba(255,190,190,${0.85*a})`,1.6]]){ctx.strokeStyle=pass[0];ctx.lineWidth=pass[1];
        for(const L of c.lines){ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);for(let i=1;i<L.length;i++)ctx.lineTo(L[i][0],L[i][1]);ctx.stroke();}}}}
  drawLabels(now);drawAmmo(now);drawAgain(now);   // v4.9 장전 칸 · ↻
  if(bloom>0.01){ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.hypot(W,H)*0.55);
    g.addColorStop(0,`rgba(${bloomCol},${Math.min(1,bloom)*0.75})`);g.addColorStop(0.35,`rgba(${bloomCol},${Math.min(1,bloom)*0.25})`);g.addColorStop(1,`rgba(${bloomCol},0)`);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';}
  const slowV=(now<slowUntil?0.25:0)+(S2&&!G.released?0.3:0);
  ctx.globalAlpha=clamp(TUNE.VIGNETTE_BASE+TUNE.VIGNETTE_TENSION*tension+slowV,0,1);ctx.drawImage(vig,0,0,W,H);ctx.globalAlpha=1;
  if(desat>0.01){ctx.globalAlpha=Math.min(1,desat)*0.2;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}

// ================= 루프 =================
let fpsLog=null;
function frame(now){const rdt=Math.min(50,now-lastT)/1000;
  const ts=now<hitstopUntil?0:(now<slowUntil?TUNE.SLOWMO_SCALE:(G&&G.thrown&&!G.released&&now-G.throwAt>=TUNE45.THROW_FAST_MS?TUNE4.SLOW:1));   // v4.4: 던진 직후부터 착지 전까지 슬로우
  wscale=ts;const gdt=rdt*ts;lastT=now;gtime+=gdt*1000;
  updFx(gdt);updCam(rdt,now);
  if(phase==='run'&&now-G.t0>=G.T)timeoutRun(now);
  if(phase==='air')updAir(now);
  updDice(now,gdt,rdt);
  draw(now);render3D(now,rdt);
  if(fpsLog)fpsLog.push(rdt*1000);
  requestAnimationFrame(frame);}

// ================= 입력 (누른 순간 바로 판정) =================
const blocked=t=>t&&t.closest&&t.closest('#ui,#side,#mute,#gear,#panel,#pad');
let sw=null;
function restartOk(now){return phase==='done'&&now-endT>=TUNE.RESTART_GUARD_MS;}
function resetIdle(){reset3D();S2=null;dice=[];dieSeq=null;labels.length=0;word.style.transition='';word.style.top=(cy-100)+'px';if(FOE&&FOE.used)FOE=null;showFoe();
  setWord('','');sub.textContent='';dmgEl.style.opacity=0;sumEl.innerHTML='';info.style.opacity=0;AMMO={items:[],sum:0};}
addEventListener('pointerdown',e=>{if(blocked(e.target))return;e.preventDefault();unlockAudio();const now=performance.now();
  if((phase==='idle'||phase==='done')&&!panel.hidden){panel.hidden=true;return;}
  if(phase==='idle'){startRun(now);return;}
  if(phase==='run'){sw={x:e.clientX,y:e.clientY,used:false};return;}
  if(phase==='air'){tapS2(now,e.clientX,e.clientY);return;}
  if(restartOk(now)){resetIdle();startRun(now);}},{passive:false});
addEventListener('pointermove',e=>{if(!sw||sw.used||phase!=='run')return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.hypot(dx,dy)>=TUNE4.SWIPE_PX){sw.used=true;dirInput(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'),performance.now());}});
addEventListener('pointerup',()=>{sw=null;});addEventListener('pointercancel',()=>{sw=null;});
const KEYS={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',KeyW:'U',KeyS:'D',KeyA:'L',KeyD:'R'};
addEventListener('keydown',e=>{if(e.repeat)return;const k=KEYS[e.code]||KEYS[e.key],tap=e.key===' '||e.key==='Enter';if(!k&&!tap)return;
  e.preventDefault();unlockAudio();const now=performance.now();
  if(phase==='idle'){startRun(now);return;}
  if(phase==='run'){if(k)dirInput(k,now);return;}
  if(phase==='air'){tapS2(now,null,null);return;}
  if(restartOk(now)){resetIdle();startRun(now);}});
['touchstart','touchmove','gesturestart','dblclick'].forEach(t=>addEventListener(t,e=>{if(!e.target.closest('#ui,#side,#mute,#panel,#gear,#pad'))e.preventDefault();},{passive:false}));
pad.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-k]');if(!b)return;e.preventDefault();unlockAudio();const now=performance.now();
  b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');
  if(phase==='idle'){startRun(now);return;}
  if(restartOk(now)){resetIdle();startRun(now);return;}
  if(phase==='run')dirInput(b.dataset.k,now);});
$('#ui').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-d]');if(!b||!(phase==='idle'||phase==='done'))return;
  diff=b.dataset.d;document.querySelectorAll('#ui button').forEach(x=>x.classList.toggle('on',x===b));
  if(phase==='done'){resetIdle();phase='idle';G=null;tension=0;cam.zoomT=1;pad.classList.remove('off');setWord('탭 또는 아무 방향키로 시작','small');setHint('');}});
$('#mute').addEventListener('pointerdown',()=>{unlockAudio();muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';});
$('#side').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-s]');if(!b||!(phase==='idle'||phase==='done'))return;   // v4.6 공격/방어
  SIDE=b.dataset.s;document.querySelectorAll('#side button').forEach(x=>x.classList.toggle('on',x===b));FOE=null;
  if(phase==='done'){resetIdle();phase='idle';G=null;tension=0;cam.zoomT=1;pad.classList.remove('off');setWord('탭 또는 아무 방향키로 시작','small');setHint('');}
  showFoe();});
$('#gear').addEventListener('pointerdown',()=>{panel.hidden=!panel.hidden;});
function updNote(){$('#pv').textContent=OPT.P+'%';$('#pnote').textContent=`성공 = ${OPT.P/2}% · 전원 완벽 = ${Math.min(100,OPT.P+TUNE4.ALL_PERFECT_BONUS)}%`;}
$('#pP').addEventListener('input',e=>{OPT.P=+e.target.value;updNote();});
document.querySelectorAll('#panel .seg').forEach(seg=>seg.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;
  OPT[seg.dataset.o]=+b.dataset.v;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));}));

if(!/[?&]2d\b/.test(location.search))init3D();else $('#gl').style.display='none';
layout();setWord('탭 또는 아무 방향키로 시작','small');setHint('화살표 순서대로 입력 → 착지 직전 원 타이밍');updNote();
requestAnimationFrame(t=>{lastT=t;frame(t);});
</script>
